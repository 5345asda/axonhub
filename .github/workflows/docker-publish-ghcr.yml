name: Publish Docker image to GHCR

on:
  push:
    tags:
      - "ghcr-*"
  workflow_dispatch:
    inputs:
      tag:
        description: Docker image tag to publish
        required: true
        type: string
      publish_latest:
        description: Also publish latest tag
        required: false
        default: true
        type: boolean

jobs:
  build_and_push:
    name: Build and push amd64 image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Write VERSION
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "$TAG" > internal/build/VERSION

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ github.event_name == 'workflow_dispatch' && format('ghcr.io/{0}/axonhub:{1}', github.repository_owner, inputs.tag) || format('ghcr.io/{0}/axonhub:{1}', github.repository_owner, github.ref_name) }}
            ${{ (github.event_name == 'push' || inputs.publish_latest) && format('ghcr.io/{0}/axonhub:latest', github.repository_owner) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false
